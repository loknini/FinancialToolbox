[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-toolbox-backend"
version = "0.4.0"
description = "金融工具箱微信小程序后端"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.143,<0.144",
  "uvicorn>=0.54,<0.55",
  "sqlalchemy>=2.0,<2.2",
  "alembic>=1.20,<1.21",
  "pydantic-settings>=2.15,<2.16",
  "httpx>=0.28,<0.29",
  "PyJWT>=2.15,<2.16",
  "psycopg[binary]>=3.3,<3.4",
  "pypdf>=6.20,<6.21",
  "Pillow>=12.3,<12.4",
  "openpyxl>=3.1,<4",
  "reportlab>=4.4,<5",
  "pycryptodome>=3.24,<4",
  "PyMuPDF>=1.26,<2",
  "cos-python-sdk-v5>=1.9.44,<2",
  "tencentcloud-sdk-python-ocr>=3.1.187,<4",
  "langgraph>=1.0,<2",
  "langsmith>=0.14,<0.15",
]
[project.optional-dependencies]
dev = ["pytest>=9.1,<9.2", "ruff>=0.16,<0.17"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B008"]
